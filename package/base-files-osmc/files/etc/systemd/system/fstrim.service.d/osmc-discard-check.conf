# Skip the weekly TRIM cleanly on hardware that cannot do it.
#
# Whether an SD card exposes erase to the host cannot be told from its model
# name - families like SanDisk Ultra and Samsung EVO span many years and
# controller revisions - so this is decided by asking the device. eMMC
# generally supports it; SD cards vary.
#
# The check runs each time the timer fires rather than once at install time,
# because the card can be swapped, or root moved to USB, long afterwards.
#
# An ExecCondition= command exiting between 1 and 254 marks the unit skipped
# rather than failed, so an unsupported card produces one quiet log line a
# week instead of a failed service.
#
# ExecCondition= needs systemd 243 or newer. Older versions log the key as
# unknown and ignore it, which leaves fstrim running unconditionally - the
# behaviour before this drop-in existed.
[Service]
ExecCondition=/usr/bin/osmc-supports-discard
