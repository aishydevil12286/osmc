# OSMC runtime coordination directory.
#
# Holds cross-process flags and sockets shared between the Kodi addons
# (running as 'osmc') and privileged helpers such as package maintainer
# scripts (running as root). Both sides create and remove entries here, so
# the directory is group-writable by 'osmc' rather than read-only to it.
#
# This replaces the previous use of /tmp and /var/tmp for the same purpose.
# Those are world-writable, and - more importantly - a unit that sets
# PrivateTmp= gets a private /tmp *and* /var/tmp, so anything coordinating
# through them cannot be sandboxed.
#
# No sticky bit: entries are removed by whichever side finishes with them,
# which is not always the side that created them.
d /run/osmc 0770 root osmc -
